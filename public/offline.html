<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSI 360 — Hors ligne</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0f21;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card { max-width: 380px; }
    .badge {
      width: 64px; height: 64px; border-radius: 16px;
      background: #c9a227; color: #0d0f21; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px; font-size: 24px;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { color: #8b96bd; font-size: 14px; line-height: 1.5; }
    button {
      margin-top: 20px; background: #c9a227; color: #0d0f21; border: none;
      border-radius: 6px; padding: 10px 20px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">AT</div>
    <h1>Vous êtes hors ligne</h1>
    <p>
      DSI 360 nécessite une connexion internet pour accéder à vos données à jour.
      Les données déjà consultées récemment restent disponibles en cache.
    </p>
    <button onclick="window.location.reload()">Réessayer</button>
  </div>
</body>
</html>
